<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.alt %}<link rel="alternate" hreflang="{% if page.lang == 'ru' %}en{% else %}ru{% endif %}" href="{{ page.alt | absolute_url }}">{% endif %}
  <link rel="preload" href="{{ '/fonts/literata-latin-opsz-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
{{ content }}
</body>
</html>
