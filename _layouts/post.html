---
layout: default
---
<main class="wrap">
  <p class="role"><a href="{{ '/' | relative_url }}">Andrey Myshkin</a></p>
  <article class="post">
    <h1>{{ page.title }}</h1>
    {{ content }}
    {% if page.date %}<p class="role"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y-%m-%d' }}</time></p>{% endif %}
  </article>
</main>
