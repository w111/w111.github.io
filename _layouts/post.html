---
layout: default
lang: ru
---
<main class="page post">
  <p class="mono"><a href="{{ '/' | relative_url }}">Andrey Myshkin</a></p>
  <article>
    <h1>{{ page.title }}</h1>
    {{ content }}
    {% if page.date %}<p class="mono muted"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y-%m-%d' }}</time></p>{% endif %}
  </article>
</main>
